<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f3ec">
<title>日常手帖｜個人行程與任務</title>
<style>
:root{color-scheme:light;--bg:#f7f3ec;--paper:#fffdf9;--ink:#423d35;--muted:#988f82;--line:#eee7dc;--rust:#b76c4c;--rust-pale:#f7e8de;--sage:#71836c;--sage-pale:#eaf0e5;--blue:#718da0;--gold:#bd9859;--shadow:0 9px 26px #5948300c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #c7a980;outline-offset:2px}.app{max-width:480px;min-height:100vh;margin:auto;padding-bottom:calc(78px + env(safe-area-inset-bottom));background:var(--bg);position:relative}.top{padding:23px 20px 12px}.top-row{display:flex;align-items:center;justify-content:space-between}.logo{display:flex;align-items:center;gap:10px}.logo-mark{display:grid;width:39px;height:39px;place-items:center;border-radius:13px;background:var(--rust-pale);color:var(--rust);font-size:19px}.logo-title{font-family:"Noto Serif TC","Songti TC",serif;font-size:17px;font-weight:700;letter-spacing:.05em}.logo-caption{margin-top:2px;color:var(--muted);font-size:10px;letter-spacing:.09em}.icon-btn{display:grid;width:37px;height:37px;place-items:center;border:1px solid var(--line);border-radius:50%;background:var(--paper);color:#81796e;font-size:16px}.welcome{margin:20px 0 0;font-family:"Noto Serif TC","Songti TC",serif;font-size:23px;font-weight:600;letter-spacing:.02em}.welcome span{color:var(--rust)}.subwelcome{margin:5px 0 0;color:var(--muted);font-size:12px}.date-strip{display:flex;gap:8px;overflow-x:auto;padding:14px 20px 17px;scrollbar-width:none}.date-strip::-webkit-scrollbar{display:none}.date-chip{display:flex;min-width:40px;height:62px;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:1px solid #ece5d9;border-radius:14px;background:#fcfaf6;color:#8e8679}.date-chip .dow{font-size:10px}.date-chip .num{font-size:15px;font-weight:650}.date-chip.selected{border-color:var(--rust);background:var(--rust);color:#fff;box-shadow:0 4px 10px #a95e402b}.date-chip.today:not(.selected) .num{color:var(--rust)}.section{margin:0 16px 16px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 3px 10px}.section-title{margin:0;font-family:"Noto Serif TC","Songti TC",serif;font-size:16px;font-weight:700;letter-spacing:.02em}.section-hint{color:var(--muted);font-size:10px}.habit-card,.paper-card{border:1px solid var(--line);border-radius:17px;background:var(--paper);box-shadow:var(--shadow)}.habit-card{padding:14px}.habit-progress{display:flex;align-items:center;gap:10px;margin-bottom:11px;color:var(--muted);font-size:10px}.progress-track{height:5px;flex:1;overflow:hidden;border-radius:99px;background:#eee9e0}.progress-value{height:100%;width:0;border-radius:99px;background:#82957a;transition:width .25s}.habit-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.habit{display:flex;align-items:center;gap:9px;min-height:49px;padding:8px 9px;border:1px solid #f0ece4;border-radius:12px;background:#fffefa;text-align:left;color:#555046;transition:.15s}.habit:hover{border-color:#d8c8ab}.habit.done{border-color:#e0e9db;background:#f3f7ef;color:#778370}.habit-check{display:grid;width:22px;height:22px;flex:0 0 auto;place-items:center;border:1.5px solid #d8d2c7;border-radius:50%;color:transparent;font-size:12px}.habit.done .habit-check{border-color:#82957a;color:#fff;background:#82957a}.habit-name{font-size:11px;line-height:1.4}.habit-icon{margin-left:auto;font-size:15px;opacity:.75}.text-button{border:0;color:var(--rust);background:transparent;font-size:11px}.agenda-card{padding:10px 14px 6px}.view-select{border:1px solid var(--line);border-radius:8px;padding:5px 7px;color:#7f776b;background:#fffefa;font-size:10px}.event{display:grid;grid-template-columns:46px 10px minmax(0,1fr) 25px;gap:8px;padding:11px 0;border-top:1px solid #f1ede6}.event:first-child{border-top:0}.event-time{padding-top:2px;color:#898174;font-size:10px}.event-marker{position:relative;display:flex;justify-content:center}.event-marker:before{position:absolute;top:3px;width:7px;height:7px;border:2px solid #8da084;border-radius:50%;background:var(--paper);content:""}.event-marker:after{position:absolute;top:12px;bottom:-12px;width:1px;background:#ece8df;content:""}.event:last-child .event-marker:after{display:none}.event.meeting .event-marker:before{border-color:var(--blue)}.event.personal .event-marker:before{border-color:var(--gold)}.event.deadline .event-marker:before{border-color:var(--rust)}.event-title{margin:0;font-size:11px;font-weight:650;line-height:1.5}.event-meta{margin-top:3px;color:#9b9387;font-size:9px}.event-tag{display:inline-block;margin-top:5px;padding:3px 6px;border-radius:5px;color:#6c8266;background:var(--sage-pale);font-size:9px}.meeting .event-tag{color:#69869a;background:#eaf0f3}.personal .event-tag{color:#a38651;background:#f5efdf}.deadline .event-tag{color:#a8664f;background:var(--rust-pale)}.mini-icon{width:25px;height:25px;border:0;border-radius:7px;color:#a39a8d;background:transparent}.mini-icon:hover{background:#f3eee5;color:var(--rust)}.empty{padding:17px 7px;color:#9b9387;text-align:center;font-size:11px}.task-card{padding:14px}.task-progress-line{display:flex;align-items:center;gap:8px;margin:0 0 10px;color:#9b9387;font-size:10px}.task-list{display:grid}.task{display:grid;grid-template-columns:21px minmax(0,1fr) auto 24px;align-items:start;gap:8px;padding:10px 0;border-top:1px solid #f1ede6}.task:first-child{border-top:0}.task-toggle{display:grid;width:19px;height:19px;place-items:center;border:1.5px solid #ddd6ca;border-radius:6px;color:transparent;background:#fffefa;font-size:10px}.task-toggle.checked{border-color:#82957a;color:#fff;background:#82957a}.task-title{margin:0;font-size:11px;line-height:1.55}.task.completed .task-title{color:#aaa398;text-decoration:line-through}.task-due{margin-top:3px;color:#9c9387;font-size:9px}.priority{align-self:center;padding:3px 6px;border-radius:5px;font-size:9px;white-space:nowrap}.priority.high{color:#a95f4d;background:#f8e9e4}.priority.medium{color:#9a7b42;background:#f5efdf}.priority.low{color:#6f866e;background:#edf2e9}.bottom-nav{position:fixed;z-index:4;right:0;bottom:0;left:0;display:flex;justify-content:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));border-top:1px solid #ebe5db;background:#fffdf9ed;backdrop-filter:blur(14px)}.nav-inner{display:grid;width:min(100%,480px);grid-template-columns:repeat(4,1fr)}.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;color:#a29a8e;background:transparent;font-size:9px}.nav-item .nav-icon{font-size:17px;line-height:1.2}.nav-item.active{color:var(--rust);font-weight:700}.fab{position:fixed;z-index:3;right:max(calc((100vw - 440px)/2 + 17px),20px);bottom:calc(79px + env(safe-area-inset-bottom));display:grid;width:51px;height:51px;place-items:center;border:0;border-radius:17px;color:#fff;background:var(--rust);box-shadow:0 7px 17px #9d594135;font-size:25px}.toast{position:fixed;z-index:10;right:16px;bottom:calc(145px + env(safe-area-inset-bottom));left:16px;width:max-content;max-width:calc(100% - 32px);margin:auto;padding:10px 14px;border:1px solid #e9e2d7;border-radius:10px;color:#665c4e;background:#fffdf9;box-shadow:var(--shadow);font-size:11px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateY(0)}dialog{width:min(420px,calc(100% - 28px));max-height:88vh;padding:0;overflow:auto;border:1px solid #e8e1d6;border-radius:18px;color:var(--ink);background:var(--paper);box-shadow:0 25px 80px #372b1d35}dialog::backdrop{background:#30291f65;backdrop-filter:blur(2px)}.dialog-head{display:flex;align-items:center;justify-content:space-between;padding:17px 19px;border-bottom:1px solid var(--line)}.dialog-head h2{margin:0;font-family:"Noto Serif TC","Songti TC",serif;font-size:17px}.dialog-body{display:grid;gap:13px;padding:17px 19px}.form-field{display:grid;gap:6px}.form-field label{color:#71695e;font-size:11px;font-weight:650}.form-field input,.form-field select,.form-field textarea{width:100%;min-height:40px;padding:9px 10px;border:1px solid #e6dfd4;border-radius:9px;color:var(--ink);background:#fffefa;font-size:12px}.form-field textarea{min-height:68px;resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;padding:0 19px 17px}.secondary,.primary{min-height:36px;padding:0 13px;border-radius:9px;font-size:11px}.secondary{border:1px solid var(--line);color:#766e63;background:#fff}.primary{border:0;color:#fff;background:var(--rust);font-weight:650}.hidden{display:none!important}.view-placeholder{padding:18px 8px;color:#8e867a;text-align:center;font-size:11px}@media(min-width:700px){body{padding:24px}.app{min-height:calc(100vh - 48px);padding-bottom:75px;border:1px solid #e9e2d8;border-radius:24px;overflow:hidden;box-shadow:0 20px 60px #58462a12}.top{padding-top:27px}.date-strip{justify-content:center}.bottom-nav{position:absolute;bottom:0;border-radius:0 0 24px 24px}.fab{position:absolute;right:19px;bottom:82px}.toast{bottom:150px}}@media(max-width:360px){.top{padding-right:15px;padding-left:15px}.date-strip{padding-right:15px;padding-left:15px}.section{margin-right:12px;margin-left:12px}.habit-list{gap:6px}.habit{padding:7px}.event{grid-template-columns:39px 9px minmax(0,1fr) 25px;gap:6px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="top-row"><div class="logo"><div class="logo-mark" aria-hidden="true">✿</div><div><div class="logo-title">日常手帖</div><div class="logo-caption">A LITTLE MORE PRESENT</div></div></div><button class="icon-btn" id="notify-button" aria-label="提醒設定" title="提醒設定">♧</button></div><h1 class="welcome" id="greeting">今天，也<span>慢慢來。</span></h1><p class="subwelcome" id="today-label"></p></header>
<div class="date-strip" id="date-strip" aria-label="選擇日期"></div>
<main>
<section class="section" id="habits-section"><div class="section-head"><div><h2 class="section-title">每日習慣</h2><span class="section-hint">小小的堅持，也值得記下來</span></div><button class="text-button" id="add-habit">＋ 新增習慣</button></div><div class="habit-card"><div class="habit-progress"><span id="habit-count"></span><div class="progress-track"><div class="progress-value" id="habit-progress"></div></div><span id="habit-percent">0%</span></div><div class="habit-list" id="habit-list"></div></div></section>
<section class="section" id="agenda-section"><div class="section-head"><div><h2 class="section-title" id="agenda-title">今日行程</h2><span class="section-hint" id="agenda-date"></span></div><select class="view-select" id="agenda-view" aria-label="行程檢視"><option value="day">每日時間軸</option><option value="week">每週行程</option><option value="month">月曆</option></select></div><div class="paper-card agenda-card"><div class="event-list" id="event-list"></div></div></section>
<section class="section" id="tasks-section"><div class="section-head"><div><h2 class="section-title">待辦清單</h2><span class="section-hint">一件一件來，就很好</span></div><button class="text-button" id="filter-tasks">全部任務⌄</button></div><div class="paper-card task-card"><div class="task-progress-line"><span id="task-count"></span><div class="progress-track"><div class="progress-value" id="task-progress"></div></div></div><div class="task-list" id="task-list"></div></div></section>
</main><footer style="padding:0 20px;color:#a0988c;font-size:10px">資料保存在這台裝置的瀏覽器中。</footer><button class="fab" id="open-create" aria-label="新增行程或任務">＋</button>
<nav class="bottom-nav" aria-label="主要導覽"><div class="nav-inner"><button class="nav-item active" data-nav="home"><span class="nav-icon">⌂</span>首頁</button><button class="nav-item" data-nav="agenda"><span class="nav-icon">▦</span>行程</button><button class="nav-item" data-nav="tasks"><span class="nav-icon">☷</span>任務</button><button class="nav-item" data-nav="habits"><span class="nav-icon">♡</span>習慣</button></div></nav><div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="entry-dialog"><form id="entry-form"><div class="dialog-head"><h2 id="dialog-title">新增內容</h2><button class="icon-btn" type="button" data-close aria-label="關閉">×</button></div><div class="dialog-body">
<div class="form-field"><label for="entry-type">要新增</label><select id="entry-type"><option value="task">待辦任務</option><option value="event">行程</option></select></div>
<div class="form-field"><label for="entry-title">標題</label><input id="entry-title" required maxlength="80" placeholder="寫下要記住的事"></div>
<div class="form-field" id="task-fields"><div class="form-grid"><div class="form-field"><label for="entry-date">截止日期</label><input id="entry-date" type="date" required></div><div class="form-field"><label for="entry-priority">優先級</label><select id="entry-priority"><option value="high">高</option><option value="medium" selected>中</option><option value="low">低</option></select></div></div></div>
<div class="form-field hidden" id="event-fields"><div class="form-grid"><div class="form-field"><label for="event-date">日期</label><input id="event-date" type="date"></div><div class="form-field"><label for="event-category">類別</label><select id="event-category"><option value="meeting">工作</option><option value="personal">個人</option><option value="deadline">重要</option></select></div></div><div class="form-grid"><div class="form-field"><label for="event-start">開始時間</label><input id="event-start" type="time"></div><div class="form-field"><label for="event-end">結束時間</label><input id="event-end" type="time"></div></div><div class="form-field"><label for="event-location">地點（選填）</label><input id="event-location" maxlength="80" placeholder="例如：線上會議"></div><div class="form-field"><label for="event-note">備註（選填）</label><textarea id="event-note" maxlength="300" placeholder="補充細節"></textarea></div></div>
</div><div class="dialog-actions"><button class="secondary" type="button" data-close>取消</button><button class="primary" type="submit">儲存</button></div></form></dialog>
<dialog id="habit-dialog"><form id="habit-form"><div class="dialog-head"><h2>新增每日習慣</h2><button class="icon-btn" type="button" data-close aria-label="關閉">×</button></div><div class="dialog-body"><div class="form-field"><label for="habit-title">習慣名稱</label><input id="habit-title" required maxlength="40" placeholder="例如：睡前閱讀 10 分鐘"></div><div class="form-field"><label for="habit-emoji">小圖示（選填）</label><input id="habit-emoji" maxlength="4" placeholder="🌱"></div></div><div class="dialog-actions"><button class="secondary" type="button" data-close>取消</button><button class="primary" type="submit">新增習慣</button></div></form></dialog>
<dialog id="settings-dialog"><form id="settings-form"><div class="dialog-head"><h2>提醒設定</h2><button class="icon-btn" type="button" data-close aria-label="關閉">×</button></div><div class="dialog-body"><p style="margin:0;color:#8e867a;font-size:11px;line-height:1.7">原型中的提醒設定僅供展示。正式推播與電子郵件需要帳號及通知服務。</p><div class="form-field"><label><input id="reminder-toggle" type="checkbox"> 開啟行程提醒偏好</label></div><div class="form-field"><label for="reminder-time">每日提醒時間</label><input id="reminder-time" type="time" value="08:00"></div><div class="form-field"><label><input id="email-toggle" type="checkbox"> 電子郵件提醒偏好</label></div></div><div class="dialog-actions"><button class="primary" type="submit">儲存偏好</button></div></form></dialog>
</div>
<script>
(() => {
  'use strict';
  const KEY='daily-planner-prototype-v1';
  const $=(selector)=>document.querySelector(selector);
  const dateKey=(date)=>{const d=new Date(date);d.setHours(12,0,0,0);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
  const today=dateKey(new Date());
  const seed=()=>({habits:[{id:'h1',title:'喝一杯溫水',icon:'💧'},{id:'h2',title:'閱讀 10 分鐘',icon:'📖'},{id:'h3',title:'伸展一下身體',icon:'🌱'},{id:'h4',title:'寫下感謝的事',icon:'✍️'}],checks:{},events:[{id:'e1',title:'整理本週計畫',date:today,start:'09:30',end:'10:00',location:'書桌前',note:'',category:'personal'},{id:'e2',title:'專案同步會議',date:today,start:'11:00',end:'11:45',location:'線上會議',note:'',category:'meeting'},{id:'e3',title:'寄出提案初稿',date:today,start:'15:00',end:'15:30',location:'',note:'',category:'deadline'}],tasks:[{id:'t1',title:'回覆重要郵件',date:today,priority:'high',done:false},{id:'t2',title:'採買晚餐食材',date:today,priority:'medium',done:false},{id:'t3',title:'整理書桌',date:today,priority:'low',done:true}],settings:{reminder:false,email:false,time:'08:00'}});
  function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return seed();const data=JSON.parse(raw);return {...seed(),...data,settings:{...seed().settings,...(data.settings||{})}}}catch{return seed()}}
  let data=load(), selected=today, taskFilter='all', toastTimer;
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch{notify('無法儲存資料，請檢查瀏覽器儲存空間。');return false}}
  function notify(message){const toast=$('#toast');toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2400)}
  const shortDate=(key)=>new Date(`${key}T12:00:00`).toLocaleDateString('zh-TW',{month:'long',day:'numeric',weekday:'long'});
  function renderDates(){const base=new Date(`${selected}T12:00:00`);const start=new Date(base);start.setDate(start.getDate()-3);const strip=$('#date-strip');strip.replaceChildren();for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);const key=dateKey(d);const b=document.createElement('button');b.className=`date-chip${key===selected?' selected':''}${key===today?' today':''}`;b.innerHTML=`<span class="dow">${d.toLocaleDateString('zh-TW',{weekday:'short'})}</span><span class="num">${d.getDate()}</span>`;b.setAttribute('aria-label',shortDate(key));b.setAttribute('aria-pressed',key===selected);b.addEventListener('click',()=>{selected=key;render()});strip.append(b)}$('#today-label').textContent=shortDate(selected);$('#agenda-date').textContent=shortDate(selected)}
  function renderHabits(){const list=$('#habit-list');list.replaceChildren();const checked=new Set(data.checks[selected]||[]);data.habits.forEach(h=>{const b=document.createElement('button');b.className=`habit${checked.has(h.id)?' done':''}`;b.setAttribute('aria-pressed',checked.has(h.id));b.innerHTML=`<span class="habit-check">✓</span><span class="habit-name"></span><span class="habit-icon"></span>`;b.querySelector('.habit-name').textContent=h.title;b.querySelector('.habit-icon').textContent=h.icon||'✦';b.addEventListener('click',()=>{const current=new Set(data.checks[selected]||[]);current.has(h.id)?current.delete(h.id):current.add(h.id);data.checks[selected]=[...current];persist();renderHabits()});list.append(b)});if(!data.habits.length)list.innerHTML='<div class="empty">新增一個小習慣，開始照顧自己吧。</div>';const n=checked.size,total=data.habits.length,pct=total?Math.round(n/total*100):0;$('#habit-count').textContent=`今日完成 ${n} / ${total}`;$('#habit-percent').textContent=`${pct}%`;$('#habit-progress').style.width=`${pct}%`}
  const categoryName={meeting:'工作',personal:'個人',deadline:'重要'};
  function renderEvents(){const list=$('#event-list');list.replaceChildren();const view=$('#agenda-view').value;let entries=[];if(view==='month'){const date=new Date(`${selected}T12:00:00`);const first=new Date(date.getFullYear(),date.getMonth(),1,12);const days=new Date(date.getFullYear(),date.getMonth()+1,0).getDate();const head=document.createElement('div');head.style.cssText='display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;color:#9b9387;font-size:9px;padding:6px 0';['日','一','二','三','四','五','六'].forEach(x=>{const s=document.createElement('span');s.textContent=x;head.append(s)});list.append(head);const grid=document.createElement('div');grid.style.cssText='display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:4px 0 10px';for(let i=0;i<first.getDay();i++){grid.append(document.createElement('span'))}for(let day=1;day<=days;day++){const key=dateKey(new Date(date.getFullYear(),date.getMonth(),day,12));const b=document.createElement('button');const has=data.events.some(e=>e.date===key);b.style.cssText=`height:38px;border:0;border-radius:9px;color:${key===selected?'white':'#61594f'};background:${key===selected?'var(--rust)':'transparent'};font-size:11px;position:relative`;b.textContent=day;if(has){const dot=document.createElement('i');dot.style.cssText=`position:absolute;bottom:5px;left:calc(50% - 2px);width:4px;height:4px;border-radius:50%;background:${key===selected?'white':'var(--rust)'}`;b.append(dot)}b.addEventListener('click',()=>{selected=key;$('#agenda-view').value='day';render()});grid.append(b)}list.append(grid);const monthLabel=document.createElement('div');monthLabel.className='empty';monthLabel.textContent=`${date.getFullYear()} 年 ${date.getMonth()+1} 月 · 點選日期查看行程`;list.append(monthLabel);return}
    if(view==='week'){const date=new Date(`${selected}T12:00:00`);const monday=new Date(date);monday.setDate(date.getDate()-((date.getDay()+6)%7));const sunday=new Date(monday);sunday.setDate(monday.getDate()+6);const a=dateKey(monday),z=dateKey(sunday);entries=data.events.filter(e=>e.date>=a&&e.date<=z).sort((x,y)=>x.date.localeCompare(y.date)||x.start.localeCompare(y.start));$('#agenda-title').textContent='本週行程';if(!entries.length){list.innerHTML='<div class="empty">這週還沒有安排，留一點空白也很好。</div>';return}let last='';entries.forEach(e=>{if(e.date!==last){const day=document.createElement('div');day.style.cssText='padding:9px 0 5px;border-top:1px solid #f1ede6;color:#968c7e;font-size:10px';day.textContent=shortDate(e.date);list.append(day);last=e.date}list.append(eventNode(e))});return}
    $('#agenda-title').textContent='今日行程';entries=data.events.filter(e=>e.date===selected).sort((a,b)=>a.start.localeCompare(b.start));if(!entries.length){list.innerHTML='<div class="empty">今天留白也很好。點選＋新增一個行程。</div>';return}entries.forEach(e=>list.append(eventNode(e)))}
  function eventNode(e){const node=document.createElement('article');node.className=`event ${e.category}`;node.innerHTML='<time class="event-time"></time><span class="event-marker"></span><div><p class="event-title"></p><div class="event-meta"></div><span class="event-tag"></span></div><button class="mini-icon" type="button" aria-label="刪除行程">×</button>';node.querySelector('.event-time').textContent=e.start;node.querySelector('.event-title').textContent=e.title;node.querySelector('.event-meta').textContent=[e.location,e.note].filter(Boolean).join(' · ');node.querySelector('.event-tag').textContent=categoryName[e.category]||'行程';node.querySelector('button').addEventListener('click',()=>{if(confirm(`刪除「${e.title}」？`)){data.events=data.events.filter(x=>x.id!==e.id);persist();render()}});return node}
  const priorityName={high:'高優先',medium:'中優先',low:'低優先'};
  function renderTasks(){const list=$('#task-list');list.replaceChildren();const dayTasks=data.tasks.filter(t=>t.date===selected).sort((a,b)=>({high:0,medium:1,low:2}[a.priority]-{high:0,medium:1,low:2}[b.priority]));const shown=dayTasks.filter(t=>taskFilter==='all'||(taskFilter==='done'?t.done:!t.done));if(!shown.length)list.innerHTML='<div class="empty">沒有待辦事項。完成一件小事也很棒。</div>';shown.forEach(t=>{const node=document.createElement('div');node.className=`task${t.done?' completed':''}`;node.innerHTML='<button class="task-toggle" type="button" aria-label="切換完成狀態">✓</button><div><p class="task-title"></p><div class="task-due"></div></div><span class="priority"></span><button class="mini-icon" type="button" aria-label="刪除任務">×</button>';node.querySelector('.task-toggle').classList.toggle('checked',t.done);node.querySelector('.task-toggle').setAttribute('aria-pressed',t.done);node.querySelector('.task-title').textContent=t.title;node.querySelector('.task-due').textContent=t.done?'已完成':`截止 ${t.date===today?'今天':new Date(`${t.date}T12:00:00`).toLocaleDateString('zh-TW',{month:'numeric',day:'numeric'})}`;node.querySelector('.priority').className=`priority ${t.priority}`;node.querySelector('.priority').textContent=priorityName[t.priority];node.querySelector('.task-toggle').addEventListener('click',()=>{t.done=!t.done;persist();renderTasks()});node.querySelector('.mini-icon').addEventListener('click',()=>{if(confirm(`刪除「${t.title}」？`)){data.tasks=data.tasks.filter(x=>x.id!==t.id);persist();renderTasks()}});list.append(node)});const done=dayTasks.filter(t=>t.done).length,pct=dayTasks.length?Math.round(done/dayTasks.length*100):0;$('#task-count').textContent=`今天完成 ${done} / ${dayTasks.length} 項`;$('#task-progress').style.width=`${pct}%`}
  function render(){renderDates();renderHabits();renderEvents();renderTasks()}
  const entryDialog=$('#entry-dialog'),habitDialog=$('#habit-dialog');
  function updateEntryFields(){const isTask=$('#entry-type').value==='task';$('#task-fields').classList.toggle('hidden',!isTask);$('#event-fields').classList.toggle('hidden',isTask);$('#entry-date').required=isTask;$('#event-date').required=!isTask;$('#event-start').required=!isTask;$('#event-end').required=!isTask;$('#dialog-title').textContent=isTask?'新增待辦任務':'新增行程'}
  $('#entry-type').addEventListener('change',updateEntryFields);
  $('#open-create').addEventListener('click',()=>{const form=$('#entry-form');form.reset();$('#entry-date').value=selected;$('#event-date').value=selected;updateEntryFields();entryDialog.showModal()});
  $('#entry-form').addEventListener('submit',e=>{e.preventDefault();const title=$('#entry-title').value.trim();if(!title)return;const id=globalThis.crypto?.randomUUID?.()||String(Date.now());if($('#entry-type').value==='task'){data.tasks.push({id,title,date:$('#entry-date').value,priority:$('#entry-priority').value,done:false});notify('任務已加入清單。')}else{const start=$('#event-start').value,end=$('#event-end').value;if(end<=start){notify('結束時間需要晚於開始時間。');return}data.events.push({id,title,date:$('#event-date').value,start,end,location:$('#event-location').value.trim(),note:$('#event-note').value.trim(),category:$('#event-category').value});selected=$('#event-date').value;notify('行程已安排妥當。')}persist();entryDialog.close();render()});
  $('#add-habit').addEventListener('click',()=>{$('#habit-form').reset();habitDialog.showModal()});
  $('#habit-form').addEventListener('submit',e=>{e.preventDefault();data.habits.push({id:globalThis.crypto?.randomUUID?.()||String(Date.now()),title:$('#habit-title').value.trim(),icon:$('#habit-emoji').value.trim()||'✦'});persist();habitDialog.close();renderHabits();notify('新習慣已加入。')});
  document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>b.closest('dialog').close()));
  $('#agenda-view').addEventListener('change',renderEvents);
  $('#filter-tasks').addEventListener('click',()=>{taskFilter=taskFilter==='all'?'open':taskFilter==='open'?'done':'all';$('#filter-tasks').textContent=taskFilter==='all'?'全部任務⌄':taskFilter==='open'?'未完成⌄':'已完成⌄';renderTasks()});
  $('#notify-button').addEventListener('click',()=>{ $('#reminder-toggle').checked=Boolean(data.settings.reminder);$('#email-toggle').checked=Boolean(data.settings.email);$('#reminder-time').value=data.settings.time||'08:00';$('#settings-dialog').showModal()});
  $('#settings-form').addEventListener('submit',e=>{e.preventDefault();data.settings={reminder:$('#reminder-toggle').checked,email:$('#email-toggle').checked,time:$('#reminder-time').value};persist();$('#settings-dialog').close();notify('提醒偏好已儲存（原型展示）。')});
  document.querySelectorAll('[data-nav]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x===button));const target=button.dataset.nav;const section=target==='habits'?'#habits-section':target==='agenda'?'#agenda-section':target==='tasks'?'#tasks-section':null;if(section)$(section).scrollIntoView({behavior:'smooth',block:'start'});else window.scrollTo({top:0,behavior:'smooth'})}));
  render();
})();
</script>
</body>
</html>
